<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurir Langit — Kepulauan Angin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="sky" width="1280" height="720"></canvas>
  <div id="toast" class="hidden"></div>
  <div id="card" class="hidden">
    <h2 id="card-title"></h2>
    <p id="card-body"></p>
    <p id="card-keys"></p>
    <button id="card-go">Terbang</button>
  </div>
  <div id="debrief" class="hidden">
    <h2 id="debrief-title">Penerbangan Selesai</h2>
    <div id="debrief-stars"></div>
    <table id="debrief-table"></table>
    <p id="debrief-note"></p>
    <button id="debrief-again">Terbang Lagi</button>
  </div>
  <div id="help">
    <b>Kurir Langit</b> — W/S gas &middot; &larr;/&rarr; belok &middot; &uarr;/&darr; naik/turun
    &middot; Spasi lepas paket &middot; M mouse &middot; P jeda &middot; R ulang
  </div>
</div>
<script type="module" src="src/boot.js"></script>
</body>
</html>
